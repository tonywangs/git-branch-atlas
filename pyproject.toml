[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "git-branch-atlas"
version = "0.2.0"
description = "A compact terminal atlas for Git branches and history"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tony Wang"}]
dependencies = []

[project.scripts]
git-branch-atlas = "git_branch_atlas.cli:main"

[tool.setuptools.packages.find]
include = ["git_branch_atlas*"]
